services:
  - type: web
    name: mydocx-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    disk:
      name: mydocx-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: MYDOCX_DATA_DIR
        value: /var/data
      - key: MYDOCX_USERS_DB
        value: /var/data/users.sqlite3
      - key: MYDOCX_COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-flash-latest
