<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#EBE2CC">
  <title>Create account - MyDocx.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
  <link href="/static/styles.css" rel="stylesheet">
  <link href="/static/auth.css" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="auth-brand" href="/">MyDocx<span>.ai</span></a>
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <p class="auth-description">A personal space for the documents that matter.</p>
    <form id="auth-form" data-mode="register">
      <label for="display-name">Your name</label>
      <input id="display-name" name="display_name" type="text" autocomplete="name" placeholder="Your name" required minlength="2" maxlength="100">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required maxlength="254">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 12 characters" required minlength="12" maxlength="128">
      <p id="auth-error" class="auth-error" role="alert" hidden></p>
      <button id="submit-button" class="auth-submit" type="submit">Create account</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
  </main>
  <script src="/static/auth.js"></script>
</body>
</html>
